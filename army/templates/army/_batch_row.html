<div class="batch-row">
  <div class="batch-label"><b>{{ label }}</b><span>{{ path }}</span></div>
  <div class="cells">
    {% for b in summary.batches %}
      <span class="cell {{ b.status }}" title="Batch {{ b.number }} · {{ b.status }}{% if b.item_count is not None %} · {{ b.item_count }} items{% endif %}{% if b.attempts %} · {{ b.attempts }} retries{% endif %}{% if b.error %} · {{ b.error|truncatechars:140 }}{% endif %}">{{ b.number }}{% if b.attempts and b.status != 'processed' %}<sup>{{ b.attempts }}</sup>{% endif %}</span>
    {% empty %}
      <span class="dim" style="font-size:13px">Not started</span>
    {% endfor %}
  </div>
  <div class="batch-stats">
    {{ summary.processed }}/{{ summary.total }} processed<br>
    {{ summary.retries }} retr{{ summary.retries|pluralize:"y,ies" }}
  </div>
</div>
