<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Django War Simulator{% endblock %}</title>
  {% if auto_refresh %}<meta http-equiv="refresh" content="2">{% endif %}
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2330; }
    header { background: #1d2330; color: #fff; padding: 12px 24px; display: flex; gap: 24px; align-items: center; }
    header a { color: #cfd6e4; text-decoration: none; }
    header a:hover { color: #fff; }
    header strong { margin-right: auto; }
    main { max-width: 1150px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; }
    .stat { background: #fff; border-radius: 8px; padding: 12px 16px; min-width: 130px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .stat b { display: block; font-size: 24px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e6e8ee; }
    th { color: #5b6476; font-weight: 600; }
    button { background: #2f6fec; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
    button.secondary { background: #6b7385; }
    form { display: inline; }
    .blue { color: #2f6fec; font-weight: 600; }
    .red { color: #d33a3a; font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e6e8ee; }
    .badge.done, .badge.processed { background: #d8f3e0; color: #17733a; }
    .badge.running, .badge.downloading, .badge.downloaded, .badge.queued { background: #fff2cc; color: #8a6100; }
    .badge.retrying, .badge.failed { background: #fde0e0; color: #a02020; }
    .msg { background: #e5efff; border-left: 4px solid #2f6fec; padding: 8px 12px; margin-bottom: 12px; }
    .bar { background: #e6e8ee; border-radius: 4px; height: 8px; width: 120px; display: inline-block; vertical-align: middle; }
    .bar span { display: block; height: 8px; border-radius: 4px; background: #2fa35a; }
    .muted { color: #6b7385; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <strong>⚔ Django War Simulator</strong>
  <a href="{% url 'home' %}">Army</a>
  <a href="{% url 'simulate' %}">Simulate</a>
  <a href="/admin/">Admin</a>
</header>
<main>
  {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
